name: CI

# Runs on every push and pull request. The point is that a change which breaks the recovery
# contract cannot land quietly: the conformance suite is the contract, and it runs on three
# platforms because a recovery tool that only works where its authors develop is not much of a
# promise.
#
# Three platforms is also the expensive part, so it runs where it earns its keep. A pull request
# gets Linux and a short fuzz pass; `main` gets the full matrix; the full fuzz corpus runs nightly,
# where minutes are cheap and nobody is waiting.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the long fuzz run.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which platforms this run covers. A pull request is a fast signal; `main` and the nightly run
  # are the thorough ones.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
      fuzz-iterations: ${{ steps.pick.outputs.fuzz-iterations }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'platforms=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'fuzz-iterations=200' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'platforms=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'fuzz-iterations=3000' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'fuzz-iterations=600' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: scope
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build cli/BinaryPaper.Recovery.slnx -c Release

      # --blame-crash: a fuzz target that takes the test host down otherwise reports only "Test
      # host process crashed", which names neither the test nor the input. With it, the run leaves
      # a sequence file naming the test that was executing and a dump beside it.
      - name: Unit and fuzz tests
        env:
          # The seed is fixed, so a short run is a prefix of the long one: it explores nothing the
          # nightly run would not.
          BP_FUZZ_ITERATIONS: ${{ needs.scope.outputs.fuzz-iterations }}
        run: >
          dotnet test cli/BinaryPaper.Recovery.slnx -c Release --no-build
          --blame-crash
          --results-directory artifacts/test-results
          --filter "FullyQualifiedName!~ImageDecodingSurvivesArbitraryMutation"

      - name: Conformance suite
        run: dotnet run --project cli/src/BinaryPaper.Recovery.Cli -c Release --no-build -- verify-vectors vectors

      - name: Vector manifest integrity
        shell: pwsh
        run: ./tools/verify-vector-integrity.ps1

      # Run separately, and last, because it can take the test host down with it.
      #
      # The image target drives a native decoder with deliberately corrupted images, and that
      # decoder has a memory-safety defect: it occasionally corrupts its own heap, and the runtime
      # then kills the process with no catchable error. An aborted run loses the results of every
      # sibling target that had not finished, which would let a real regression hide behind a known
      # external fault. Given its own step, a crash fails only itself and the rest still reports.
      #
      # Last in the job for the same reason: a failing step skips the ones after it, so anything
      # placed below this would be hidden by a crash exactly as the sibling targets were.
      #
      # It is deliberately not allowed to fail. The defect is upstream and unfixed, so this step is
      # expected to go red occasionally - most often on the nightly deep run - and that is the
      # honest signal, not something to suppress.
      - name: Image fuzz target
        env:
          BP_FUZZ_ITERATIONS: ${{ needs.scope.outputs.fuzz-iterations }}
        run: >
          dotnet test cli/test/BinaryPaper.Recovery.FuzzTests -c Release --no-build
          --blame-crash
          --results-directory artifacts/test-results
          --filter "FullyQualifiedName~ImageDecodingSurvivesArbitraryMutation"

      - name: Keep the crash evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: publication audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The audit scans history, not just the tip. A shallow clone would let a finding hide.
          fetch-depth: 0

      # The private-reference pattern list cannot live in this repository - publishing the names of
      # private repositories is the very thing being audited for - so it arrives as a secret.
      #
      # A pull request from a fork receives no secrets by design. Rather than putting a permanent
      # red mark on every outside contribution, such a run does the rest of the audit and says
      # plainly that it cannot clear the repository for publication. The run that authorises a
      # release is the one on a tag, which does have the secret and does require it.
      - name: Publication audit
        shell: pwsh
        env:
          BP_PRIVATE_REFERENCE_PATTERNS: ${{ secrets.PRIVATE_REFERENCE_PATTERNS }}
        run: |
          $forkPr = '${{ github.event_name }}' -eq 'pull_request' -and
            '${{ github.event.pull_request.head.repo.full_name }}' -ne '${{ github.repository }}'

          if ($forkPr) {
            ./tools/publication-audit.ps1 -AllowMissingPatterns
          }
          else {
            ./tools/publication-audit.ps1
          }

  drill:
    name: offline recovery drill
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build release artifacts
        shell: pwsh
        # A real version string: it reaches the build as -p:Version, which NuGet parses, and
        # "ci" is not a version. The drill is about the archive, not the number on it.
        run: ./tools/build-release.ps1 -Version 0.0.0-ci -OutputDirectory artifacts -RuntimeIdentifiers @('linux-x64')

      - name: Offline recovery drill
        shell: pwsh
        run: |
          $manifest = Get-Content vectors/1.0/positive/plaintext-text-note/manifest.json | ConvertFrom-Json
          $expected = $manifest.expected.outputs[0].sha256
          ./tools/offline-drill.ps1 `
            -ArtifactsDirectory artifacts `
            -RuntimeIdentifier linux-x64 `
            -ImagesDirectory vectors/1.0/images/image-multi-code-png `
            -ExpectedSha256 $expected
