name: CI

# Runs on every push and pull request. The point is that a change which breaks the recovery
# contract cannot land quietly: the conformance suite is the contract, and it runs on three
# platforms because a recovery tool that only works where its authors develop is not much of a
# promise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build cli/BinaryPaper.Recovery.slnx -c Release

      - name: Unit and fuzz tests
        run: dotnet test cli/BinaryPaper.Recovery.slnx -c Release --no-build

      - name: Conformance suite
        run: dotnet run --project cli/src/BinaryPaper.Recovery.Cli -c Release --no-build -- verify-vectors vectors

      - name: Vector manifest integrity
        shell: pwsh
        run: ./tools/verify-vector-integrity.ps1

  audit:
    name: publication audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit scans history, not just the tip. A shallow clone would let a finding hide.
          fetch-depth: 0

      - name: Publication audit
        shell: pwsh
        run: ./tools/publication-audit.ps1

  drill:
    name: offline recovery drill
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build release artifacts
        shell: pwsh
        run: ./tools/build-release.ps1 -Version ci -OutputDirectory artifacts -RuntimeIdentifiers @('linux-x64')

      - name: Offline recovery drill
        shell: pwsh
        run: |
          $manifest = Get-Content vectors/1.0/positive/plaintext-text-note/manifest.json | ConvertFrom-Json
          $expected = $manifest.expected.outputs[0].sha256
          ./tools/offline-drill.ps1 `
            -ArtifactsDirectory artifacts `
            -RuntimeIdentifier linux-x64 `
            -ImagesDirectory vectors/1.0/images/image-multi-code-png `
            -ExpectedSha256 $expected
