name: Release

# Builds and publishes a recovery kit release.
#
# Triggered only by pushing a `recovery-kit-v*` tag. That is deliberate: publishing is an
# irreversible act - a release tag and its assets are immutable once people have downloaded them -
# and it should require someone to deliberately create a tag, never happen as a side effect of a
# merge.
#
# The whole audience for these artifacts is someone recovering a backup, possibly years from now,
# possibly offline. So this workflow refuses to publish anything that has not passed the conformance
# suite, the publication audit, and an offline drill on the artifact it is about to publish.

on:
  push:
    tags: ['recovery-kit-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (does not publish)'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify before building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # A release must not be able to skip these. They are separate steps so a failure names
      # exactly which promise would have been broken.
      - name: Conformance suite
        run: |
          dotnet build cli/BinaryPaper.Recovery.slnx -c Release
          dotnet run --project cli/src/BinaryPaper.Recovery.Cli -c Release --no-build -- verify-vectors vectors

      - name: Unit tests and fixture integrity
        shell: pwsh
        env:
          BP_FUZZ_ITERATIONS: '200'
        run: |
          dotnet test cli/BinaryPaper.Recovery.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./tools/verify-vector-integrity.ps1
          ./tools/tests/release-dependencies.tests.ps1

      # A release whose changelog still says "Unreleased" tells every reader that nothing has
      # shipped, on the page announcing that something has. Cheap to forget, cheap to check.
      - name: Changelog names this release
        if: startsWith(github.ref, 'refs/tags/recovery-kit-v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! grep -q "^## \[${tag}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${tag}]' section. Rename the pending section to this tag before releasing."
            exit 1
          fi

      # The changelog is not the only place that says whether anything has shipped. The README
      # status line, the specification's own status banner, and the errata file each say the
      # release has not happened, and each of them is wrong the moment a tag exists - on the
      # specification whose meaning this tag freezes. Nothing was checking them.
      - name: Release banners are flipped
        if: startsWith(github.ref, 'refs/tags/recovery-kit-v')
        shell: bash
        run: |
          if git grep -n -I -E 'Status: unreleased|[*][*]Unreleased[.][*][*]|has not been released yet' -- ':!CHANGELOG.md' ':!.github/'; then
            echo "::error::The lines above still describe this release as unreleased. Flip them before tagging."
            exit 1
          fi

      # No -AllowMissingPatterns here, ever. This is the run that authorises publication, and it
      # must fail closed if the pattern list is absent.
      - name: Publication audit
        shell: pwsh
        env:
          BP_PRIVATE_REFERENCE_PATTERNS: ${{ secrets.PRIVATE_REFERENCE_PATTERNS }}
        run: ./tools/publication-audit.ps1

  boundary:
    name: boundary recovery (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate public boundary fixtures
        run: dotnet run --project benchmarks/BinaryPaper.Recovery.Corpus -c Release -- benchmarks/recipes.json artifacts/corpus
      - name: Build self-contained CLI
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/recovery-kit-v*') {
            $env:GITHUB_REF -replace '^refs/tags/recovery-kit-v', ''
          } else { $env:REQUESTED_VERSION }
          dotnet publish cli/src/BinaryPaper.Recovery.Cli -c Release -r $env:TARGET_RID --self-contained true -p:Version=$version -o artifacts/cli
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Measure exact recovery at the boundaries
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { 'artifacts/cli/binarypaper.exe' } else { 'artifacts/cli/binarypaper' }
          dotnet run --project benchmarks/BinaryPaper.Recovery.Benchmarks -c Release -- artifacts/corpus $executable --output artifacts/boundary-${{ matrix.rid }}.json
          if ($LASTEXITCODE -ne 0) { throw 'Boundary recovery failed' }
      - name: Retain boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-${{ matrix.rid }}
          path: |
            artifacts/boundary-*.json
            artifacts/corpus/corpus.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: build and publish
    runs-on: ubuntu-latest
    needs: [verify, boundary]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/recovery-kit-v*') {
            $env:GITHUB_REF -replace '^refs/tags/recovery-kit-v', ''
          } else {
            $env:REQUESTED_VERSION
          }
          "version=$version" >> $env:GITHUB_OUTPUT
        env:
          REQUESTED_VERSION: ${{ inputs.version }}

      - name: Build artifacts
        shell: pwsh
        run: ./tools/build-release.ps1 -Version $env:KIT_VERSION -OutputDirectory artifacts
        env:
          KIT_VERSION: ${{ steps.version.outputs.version }}

      - name: Download boundary evidence
        uses: actions/download-artifact@v4
        with:
          pattern: boundary-*
          path: boundary-evidence

      - name: Confirm the public corpus is identical across runtimes
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem boundary-evidence -Filter corpus.json -Recurse)
          if ($manifests.Count -ne 3) { throw 'Missing boundary evidence' }
          $hashes = @($manifests | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash } | Select-Object -Unique)
          if ($hashes.Count -ne 1) { throw 'Corpus generation differed between platforms' }
          Copy-Item $manifests[0].FullName artifacts/boundary-corpus.evidence.json
          Get-ChildItem boundary-evidence -Filter 'boundary-*.json' -Recurse | ForEach-Object {
            Copy-Item $_.FullName (Join-Path artifacts ($_.BaseName + '.evidence.json'))
          }

      - name: Offline recovery drill against the built artifact
        shell: pwsh
        run: |
          $manifest = Get-Content vectors/1.0/positive/plaintext-text-note/manifest.json | ConvertFrom-Json
          $expected = $manifest.expected.outputs[0].sha256
          foreach ($case in @('image-multi-code-png', 'image-jpeg')) {
            & ./tools/offline-drill.ps1 -ArtifactsDirectory artifacts -RuntimeIdentifier linux-x64 `
              -ImagesDirectory "vectors/1.0/images/$case" -ExpectedSha256 $expected `
              -ReportPath "artifacts/offline-$case.evidence.json"
            if ($LASTEXITCODE -ne 0) { throw "Offline drill failed for $case" }
          }
          # Evidence is part of the release: hash it before attesting the final manifest.
          $lines = Get-ChildItem artifacts -File | Where-Object Name -ne SHA256SUMS | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $lines | Set-Content artifacts/SHA256SUMS -Encoding utf8NoBOM

      # Keyless build provenance, tied to this commit and this workflow. It lets someone verify that
      # an archive was produced here from this source, rather than trusting whoever handed it to
      # them - which is the whole point for a tool people download to recover their own data.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'artifacts/*'

      - name: Retain complete release rehearsal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-kit-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/recovery-kit-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/*.spdx.json
            artifacts/*.evidence.json
          body: |
            BinaryPaper Recovery Kit ${{ steps.version.outputs.version }}

            Recovers **capsule wire version 1.0**.

            ## Verify before you run it

            ```
            sha256sum -c SHA256SUMS
            ```

            On Linux and macOS, a zip does not carry the executable bit, so after unpacking:

            ```
            chmod +x binarypaper
            ```

            Every archive also carries its own LICENSE and NOTICE, so a binary downloaded on its
            own still comes with the terms it is offered under.

            Build provenance is attested and can be checked with:

            ```
            gh attestation verify <archive> --repo ${{ github.repository }}
            ```

            ## What this is

            An open recovery specification and a reference recovery tool. It reads page images
            (PNG/JPEG) and raw frame files, works entirely offline, and processes recovery data locally.

            BinaryPaper itself is not open source; this is the recovery surface only.
          fail_on_unmatched_files: true
